<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skins</title>
    <link rel="stylesheet" href="./assets/css/home.css" />
  </head>
  <body>
    <!-- Cabeçalho simples -->
    <header>
      <h2 style="color: white; text-align: center; padding-top: 15px">
        Loja de Skins
      </h2>
    </header>

    <main>
      <!-- The Sims 4 -->
      <section class="game" id="the-sims-4">
        <img src="./img/Sims_4_logo.svg.webp" alt="logo" class="logo-jogo" />

        <div class="grid-skins">
          <div class="skin">
            <img src="./img/Casa-Familia-Lotario-Real.jpg" alt="img casa 1" />
            <div class="skin-info">
              <p class="skin-nome">Casa Família Lotário</p>
              <p class="skin-preco">R$ 15,00</p>
            </div>
          </div>
          <div class="skin">
            <img
              src="./img/KaitlynRenee.jpg.adapt_.crop16x9.1455w-768x432.jpg"
              alt="img casa 2"
            />
            <div class="skin-info">
              <p class="skin-nome">Mansão Moderna</p>
              <p class="skin-preco">R$ 25,00</p>
            </div>
          </div>
          <div class="skin">
            <img
              src="./img/lote_construcoes-the-sims-01.jpg"
              alt="img casa 3"
            />
            <div class="skin-info">
              <p class="skin-nome">Lote de Construção</p>
              <p class="skin-preco">R$ 10,00</p>
            </div>
          </div>
          <div class="skin">
            <img
              src="./img/thesims4_7_casas_incriveis-de-suburbio_para_ter_no_jogo.png"
              alt="img casa 4"
            />
            <div class="skin-info">
              <p class="skin-nome">Casa de Subúrbio</p>
              <p class="skin-preco">R$ 20,00</p>
            </div>
          </div>
          <div class="skin">
            <img
              src="./img/WonderCarlotta.jpg.adapt_.crop16x9.1455w.png"
              alt="img casa 5"
            />
            <div class="skin-info">
              <p class="skin-nome">Wonder Carlotta</p>
              <p class="skin-preco">R$ 30,00</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Free Fire -->
      <section class="game" id="free-fire">
        <!-- Logo do Free Fire -->
        <img
          src="./img/freefire-57.png"
          alt="logo free fire"
          class="logo-jogo"
        />

        <div class="grid-skins">
          <div class="skin">
            <!-- Coloque a imagem da skin 1 aqui -->
            <img src="./img/ff1.png" alt="Skin Free Fire 1" />
            <div class="skin-info">
              <p class="skin-nome">Skin 1</p>
              <p class="skin-preco">R$ 5,00</p>
            </div>
          </div>
          <div class="skin">
            <!-- Coloque a imagem da skin 2 aqui -->
            <img src="./img/ff2.png" alt="Skin Free Fire 2" />
            <div class="skin-info">
              <p class="skin-nome">Skin 2</p>
              <p class="skin-preco">R$ 12,00</p>
            </div>
          </div>
          <div class="skin">
            <!-- Coloque a imagem da skin 3 aqui -->
            <img src="./img/ff3.png" alt="Skin Free Fire 3" />
            <div class="skin-info">
              <p class="skin-nome">Skin 3</p>
              <p class="skin-preco">R$ 8,00</p>
            </div>
          </div>
          <div class="skin">
            <!-- Coloque a imagem da skin 4 aqui -->
            <img src="./img/ff4.png" alt="Skin Free Fire 4" />
            <div class="skin-info">
              <p class="skin-nome">Skin 4</p>
              <p class="skin-preco">R$ 15,00</p>
            </div>
          </div>
          <div class="skin">
            <!-- Coloque a imagem da skin 5 aqui -->
            <img src="./img/ff5.png" alt="Skin Free Fire 5" />
            <div class="skin-info">
              <p class="skin-nome">Skin 5</p>
              <p class="skin-preco">R$ 20,00</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer
      style="height: 50px; background: #1a5669; margin-top: auto"
    ></footer>
  </body>
</html>
